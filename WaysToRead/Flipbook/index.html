<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading the Diary — Ruth Mueller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- Simple Page Flip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
        }
        #book-container {
            height: 90vh; /* Increased vertical space */
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1s ease;
            padding: 20px;
        }
        #book-container.ready {
            opacity: 1;
        }
        .page-wrapper {
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .page-canvas {
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.7);
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .controls {
            transition: opacity 0.3s ease;
        }
        .controls:hover {
            opacity: 1;
        }
    </style>
</head>
<body class="antialiased selection:bg-zinc-800 h-screen flex flex-col">

    <!-- Header -->
    <header class="flex justify-between items-center px-8 py-4 border-b border-zinc-900 z-10 bg-black/50 backdrop-blur-sm fixed top-0 w-full">
        <div>
            <span class="text-[10px] uppercase tracking-[0.3em] text-zinc-500 block">Archival Viewer</span>
            <h1 class="text-xl font-light tracking-tight text-zinc-200">The Diary <span class="italic font-serif text-zinc-400">Flipbook</span></h1>
        </div>
        <div class="flex gap-4 items-center">
            <div id="page-count" class="text-xs font-mono text-zinc-500 tracking-widest">
                LOADING...
            </div>
            <a href="index.html" class="text-[10px] uppercase tracking-widest text-zinc-500 hover:text-white transition-colors border border-zinc-800 px-3 py-1 rounded-full hover:border-zinc-600">
                Close
            </a>
        </div>
    </header>

    <!-- Main Flipbook Area -->
    <main class="flex-grow flex flex-col justify-center items-center relative pt-16">
        
        <div id="loader" class="absolute inset-0 flex flex-col items-center justify-center gap-4 bg-black z-0">
            <div class="w-12 h-12 border-t-2 border-zinc-700 rounded-full animate-spin"></div>
            <p class="text-xs uppercase tracking-widest text-zinc-600 animate-pulse">Initializing Artifact...</p>
        </div>

        <div id="book-container">
            <div id="book" class="relative">
                <!-- Pages injected here -->
            </div>
        </div>

        <!-- Navigation Controls -->
        <div class="fixed bottom-6 left-1/2 -translate-x-1/2 flex gap-8 z-20 controls opacity-60">
            <button id="btn-prev" class="group flex items-center gap-2 px-6 py-3 bg-zinc-900/80 backdrop-blur border border-zinc-800 rounded-full hover:bg-zinc-800 transition-all hover:pr-8 hover:border-zinc-600">
                <span class="text-zinc-400 group-hover:text-white transition-colors">←</span>
                <span class="text-[10px] uppercase tracking-widest text-zinc-500 group-hover:text-zinc-300">Prev</span>
            </button>
            <button id="btn-next" class="group flex items-center gap-2 px-6 py-3 bg-zinc-900/80 backdrop-blur border border-zinc-800 rounded-full hover:bg-zinc-800 transition-all hover:pl-8 hover:border-zinc-600">
                <span class="text-[10px] uppercase tracking-widest text-zinc-500 group-hover:text-zinc-300">Next</span>
                <span class="text-zinc-400 group-hover:text-white transition-colors">→</span>
            </button>
        </div>
    </main>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const pdfPaths = ['Diary1.pdf', 'Diary2.pdf', 'Diary3.pdf'];
        const bookElement = document.getElementById('book');
        const container = document.getElementById('book-container');
        const loader = document.getElementById('loader');
        const pageCountEl = document.getElementById('page-count');
        
        let pageFlip;
        const pagesRegistry = []; 
        
        const scale = 1.8; 
        const RENDER_WINDOW = 4; 

        async function initBook() {
            try {
                let globalBookIndex = 0;

                for (let fileIdx = 0; fileIdx < pdfPaths.length; fileIdx++) {
                    const loadingTask = pdfjsLib.getDocument(pdfPaths[fileIdx]);
                    const pdfDoc = await loadingTask.promise;
                    const numPages = pdfDoc.numPages;

                    for (let i = 1; i <= numPages; i++) {
                        if (fileIdx === 0 && i === 1) {
                            addPageToRegistry(globalBookIndex++, pdfDoc, i, 'full');
                        } else {
                            addPageToRegistry(globalBookIndex++, pdfDoc, i, 'left');
                            addPageToRegistry(globalBookIndex++, pdfDoc, i, 'right');
                        }
                    }
                }

                pageCountEl.textContent = `PAGE 1 OF ${pagesRegistry.length}`;

                // Setup PageFlip with more flexible constraints to ensure the "whole" page fits
                pageFlip = new St.PageFlip(bookElement, {
                    width: 500, 
                    height: 750,
                    size: 'stretch',
                    minWidth: 200,
                    maxWidth: 1200,
                    minHeight: 300,
                    maxHeight: 2000, // Increased to allow full height visibility
                    maxShadowOpacity: 0.3,
                    showCover: true,
                    mobileScrollSupport: false, 
                    flippingTime: 800, 
                    usePortrait: true,
                    startPage: 0,
                    drawShadow: true
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page-wrapper'));

                await updateVisiblePages(0);

                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 500);
                container.classList.add('ready');

                pageFlip.on('flip', (e) => {
                    const idx = e.data;
                    pageCountEl.textContent = `PAGE ${idx + 1} OF ${pagesRegistry.length}`;
                    updateVisiblePages(idx);
                });

                document.getElementById('btn-prev').addEventListener('click', () => pageFlip.flipPrev());
                document.getElementById('btn-next').addEventListener('click', () => pageFlip.flipNext());

            } catch (error) {
                console.error("Error loading flipbook:", error);
                loader.innerHTML = `<p class="text-red-500 font-mono text-center px-4">Error loading PDF parts.<br>Check console for details.</p>`;
            }
        }

        function addPageToRegistry(index, pdfDoc, pdfPageNum, type) {
            pagesRegistry.push({
                pdfDoc: pdfDoc,
                pdfPageNumber: pdfPageNum,
                type: type, 
                isRendered: false
            });

            const wrapper = document.createElement('div');
            wrapper.classList.add('page-wrapper');
            
            const canvas = document.createElement('canvas');
            canvas.classList.add('page-canvas');
            canvas.id = `canvas-${index}`;
            
            wrapper.appendChild(canvas);
            bookElement.appendChild(wrapper);
        }

        async function updateVisiblePages(currentIndex) {
            const start = Math.max(0, currentIndex - RENDER_WINDOW);
            const end = Math.min(pagesRegistry.length - 1, currentIndex + RENDER_WINDOW);

            for (let i = 0; i < pagesRegistry.length; i++) {
                if (i < start || i > end) {
                    clearCanvas(i);
                } else if (!pagesRegistry[i].isRendered) {
                    renderPageAtIndex(i);
                }
            }
        }

        function clearCanvas(index) {
            if (pagesRegistry[index].isRendered) {
                const canvas = document.getElementById(`canvas-${index}`);
                if (canvas) {
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    canvas.width = 0;
                    canvas.height = 0;
                    pagesRegistry[index].isRendered = false;
                }
            }
        }

        const scratchCanvas = document.createElement('canvas');
        const scratchCtx = scratchCanvas.getContext('2d');

        async function renderPageAtIndex(index) {
            const entry = pagesRegistry[index];
            const canvas = document.getElementById(`canvas-${index}`);
            if (!canvas) return;

            try {
                const page = await entry.pdfDoc.getPage(entry.pdfPageNumber);
                const viewport = page.getViewport({ scale: scale });
                
                scratchCanvas.width = viewport.width;
                scratchCanvas.height = viewport.height;
                await page.render({ canvasContext: scratchCtx, viewport: viewport }).promise;

                const targetCtx = canvas.getContext('2d');

                if (entry.type === 'full') {
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    targetCtx.drawImage(scratchCanvas, 0, 0);
                } else if (entry.type === 'left') {
                    canvas.width = viewport.width / 2;
                    canvas.height = viewport.height;
                    targetCtx.drawImage(scratchCanvas, 0, 0, viewport.width / 2, viewport.height, 0, 0, canvas.width, canvas.height);
                } else if (entry.type === 'right') {
                    canvas.width = viewport.width / 2;
                    canvas.height = viewport.height;
                    targetCtx.drawImage(scratchCanvas, viewport.width / 2, 0, viewport.width / 2, viewport.height, 0, 0, canvas.width, canvas.height);
                }
                
                entry.isRendered = true;
            } catch (err) {
                console.error(`Failed to render book page ${index}`, err);
            }
        }

        window.addEventListener('DOMContentLoaded', initBook);
    </script>
</body>
</html>
