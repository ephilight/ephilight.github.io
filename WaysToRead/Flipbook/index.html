<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading the Diary — Ruth Mueller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- Simple Page Flip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
        }
        #book-container {
            height: 80vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1s ease;
        }
        #book-container.ready {
            opacity: 1;
        }
        .page-wrapper {
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .page-canvas {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            /* Initial state for canvas */
            max-width: 100%;
            max-height: 100%;
        }
        .controls {
            transition: opacity 0.3s ease;
        }
        .controls:hover {
            opacity: 1;
        }
    </style>
</head>
<body class="antialiased selection:bg-zinc-800 h-screen flex flex-col">

    <!-- Header -->
    <header class="flex justify-between items-center px-8 py-6 border-b border-zinc-900 z-10 bg-black/50 backdrop-blur-sm fixed top-0 w-full">
        <div>
            <span class="text-[10px] uppercase tracking-[0.3em] text-zinc-500 block">Archival Viewer</span>
            <h1 class="text-xl font-light tracking-tight text-zinc-200">The Diary <span class="italic font-serif text-zinc-400">Flipbook</span></h1>
        </div>
        <div class="flex gap-4 items-center">
            <div id="page-count" class="text-xs font-mono text-zinc-500 tracking-widest">
                LOADING...
            </div>
            <a href="index.html" class="text-[10px] uppercase tracking-widest text-zinc-500 hover:text-white transition-colors border border-zinc-800 px-3 py-1 rounded-full hover:border-zinc-600">
                Close
            </a>
        </div>
    </header>

    <!-- Main Flipbook Area -->
    <main class="flex-grow flex flex-col justify-center items-center relative pt-20">
        
        <!-- Loading Indicator -->
        <div id="loader" class="absolute inset-0 flex flex-col items-center justify-center gap-4 bg-black z-0">
            <div class="w-12 h-12 border-t-2 border-zinc-700 rounded-full animate-spin"></div>
            <p class="text-xs uppercase tracking-widest text-zinc-600 animate-pulse">Initializing Artifact...</p>
        </div>

        <!-- Book Container -->
        <div id="book-container">
            <div id="book" class="relative">
                <!-- Pages will be injected here by JS -->
            </div>
        </div>

        <!-- Navigation Controls -->
        <div class="fixed bottom-8 left-1/2 -translate-x-1/2 flex gap-8 z-20 controls opacity-60">
            <button id="btn-prev" class="group flex items-center gap-2 px-6 py-3 bg-zinc-900/80 backdrop-blur border border-zinc-800 rounded-full hover:bg-zinc-800 transition-all hover:pr-8 hover:border-zinc-600">
                <span class="text-zinc-400 group-hover:text-white transition-colors">←</span>
                <span class="text-[10px] uppercase tracking-widest text-zinc-500 group-hover:text-zinc-300">Prev</span>
            </button>
            <button id="btn-next" class="group flex items-center gap-2 px-6 py-3 bg-zinc-900/80 backdrop-blur border border-zinc-800 rounded-full hover:bg-zinc-800 transition-all hover:pl-8 hover:border-zinc-600">
                <span class="text-[10px] uppercase tracking-widest text-zinc-500 group-hover:text-zinc-300">Next</span>
                <span class="text-zinc-400 group-hover:text-white transition-colors">→</span>
            </button>
        </div>
    </main>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const pdfPaths = ['diary1.pdf', 'diary2.pdf', 'diary3.pdf'];
        const bookElement = document.getElementById('book');
        const container = document.getElementById('book-container');
        const loader = document.getElementById('loader');
        const pageCountEl = document.getElementById('page-count');
        
        let pageFlip;
        
        // This registry will map a linear Book Page Index (0, 1, 2...)
        // to the specific PDF Document object and the specific Page Number within that PDF.
        const pagesRegistry = []; 
        
        // Configuration
        const scale = 1.5; // Render quality
        const RENDER_WINDOW = 3; // Render current page +/- 3 pages. Keep this low to save memory.

        async function initBook() {
            try {
                // 1. Pre-load PDF Structures (Metadata only, not images)
                let globalPageIndex = 0;

                for (const path of pdfPaths) {
                    const loadingTask = pdfjsLib.getDocument(path);
                    const pdfDoc = await loadingTask.promise;
                    const numPages = pdfDoc.numPages;

                    for (let i = 1; i <= numPages; i++) {
                        // Store the mapping for lazy loading later
                        pagesRegistry.push({
                            globalIndex: globalPageIndex,
                            pdfDoc: pdfDoc,
                            pdfPageNumber: i,
                            isRendered: false,
                            canvas: null
                        });

                        // Create DOM Placeholder (Empty)
                        const wrapper = document.createElement('div');
                        wrapper.classList.add('page-wrapper');
                        wrapper.dataset.density = 'soft'; // Simple paper effect
                        
                        const canvas = document.createElement('canvas');
                        canvas.classList.add('page-canvas');
                        // Assign ID to find it later
                        canvas.id = `canvas-${globalPageIndex}`;
                        
                        wrapper.appendChild(canvas);
                        bookElement.appendChild(wrapper);

                        globalPageIndex++;
                    }
                }

                pageCountEl.textContent = `PAGE 1 OF ${pagesRegistry.length}`;

                // 2. Initialize Flipbook
                pageFlip = new St.PageFlip(bookElement, {
                    width: 800, 
                    height: 500,
                    size: 'stretch',
                    minWidth: 300,
                    maxWidth: 1600,
                    minHeight: 200,
                    maxHeight: 1000,
                    maxShadowOpacity: 0.5,
                    showCover: true,
                    mobileScrollSupport: false, 
                    flippingTime: 800, 
                    usePortrait: true, // Handle spreads as single "pages"
                    startPage: 0
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page-wrapper'));

                // 3. Initial Render (First few pages only)
                await updateVisiblePages(0);

                // 4. Reveal UI
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 500);
                container.classList.add('ready');

                // 5. Event Listeners for Lazy Loading
                pageFlip.on('flip', (e) => {
                    const currentPageIndex = e.data; // The new current page index
                    pageCountEl.textContent = `PAGE ${currentPageIndex + 1} OF ${pagesRegistry.length}`;
                    
                    // Trigger Smart Rendering
                    updateVisiblePages(currentPageIndex);
                });

                document.getElementById('btn-prev').addEventListener('click', () => pageFlip.flipPrev());
                document.getElementById('btn-next').addEventListener('click', () => pageFlip.flipNext());

            } catch (error) {
                console.error("Error loading flipbook:", error);
                loader.innerHTML = `<p class="text-red-500 font-mono text-center px-4">Error loading PDF parts.<br>Memory limit exceeded or missing files.<br>Ensure diary1.pdf, diary2.pdf, diary3.pdf are present.</p>`;
            }
        }

        // Core Logic: Render only what is needed, clear what is not
        async function updateVisiblePages(currentIndex) {
            const renderQueue = [];
            
            // Calculate window
            const start = Math.max(0, currentIndex - RENDER_WINDOW);
            const end = Math.min(pagesRegistry.length - 1, currentIndex + RENDER_WINDOW);

            // 1. CLEAR pages outside the window (Free Memory)
            for (let i = 0; i < pagesRegistry.length; i++) {
                if (i < start || i > end) {
                    if (pagesRegistry[i].isRendered) {
                        const canvas = document.getElementById(`canvas-${i}`);
                        if (canvas) {
                            // Clear canvas context to free GPU memory
                            const ctx = canvas.getContext('2d');
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                            canvas.width = 0; // Effectively zeroes out the memory buffer
                            canvas.height = 0;
                            pagesRegistry[i].isRendered = false;
                        }
                    }
                }
            }

            // 2. RENDER pages inside the window
            for (let i = start; i <= end; i++) {
                if (!pagesRegistry[i].isRendered) {
                    renderQueue.push(renderPageAtIndex(i));
                }
            }

            await Promise.all(renderQueue);
        }

        async function renderPageAtIndex(index) {
            const entry = pagesRegistry[index];
            const canvas = document.getElementById(`canvas-${index}`);
            if (!canvas) return;

            try {
                const page = await entry.pdfDoc.getPage(entry.pdfPageNumber);
                const viewport = page.getViewport({ scale: scale });
                const context = canvas.getContext('2d');

                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                
                await page.render(renderContext).promise;
                entry.isRendered = true;
            } catch (err) {
                console.error(`Failed to render page ${index}`, err);
            }
        }

        window.addEventListener('DOMContentLoaded', initBook);

    </script>
</body>
</html>
